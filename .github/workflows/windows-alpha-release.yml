# Windows tagged prerelease for testers. Unsigned installers.
# Not a purchased CA / store build. vocawin.com points at GitHub Releases.
#
# Tag push is the only trigger. windows-ci.yml must never set tagName.
# PRs only cargo test. Main uploads the installer artifact.
# Nightlies are a different tag (`nightly`) in nightly.yml.
# Always prerelease: a GitHub Release here is not a public ship.
# No workflow_dispatch, so a branch click cannot publish.
# includeUpdaterJson is off so we do not upload latest.json.

name: Windows tagged prerelease

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-alpha-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Windows tagged installers
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write
    env:
      CARGO_TARGET_DIR: C:\t
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # Cache C:\t (CARGO_TARGET_DIR). Later v* tags reuse this job's artifacts.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-targets: false
          cache-directories: C:/t
      - name: Install CMake, LLVM, Ninja, and Vulkan SDK
        shell: pwsh
        run: |
          choco install cmake llvm ninja -y --no-progress
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          echo "C:\Program Files\CMake\bin" >> $env:GITHUB_PATH
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
          $ver = "1.3.290.0"
          $installer = "$env:RUNNER_TEMP\VulkanSDK.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanSDK-$ver-Installer.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait
          echo "VULKAN_SDK=C:\VulkanSDK\$ver" >> $env:GITHUB_ENV
          echo "C:\VulkanSDK\$ver\Bin" >> $env:GITHUB_PATH
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install frontend dependencies
        run: npm ci
      - name: Build NSIS and MSI, attach to the tag Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_TARGET_DIR: C:\t
          CMAKE_GENERATOR: Ninja
        with:
          tagName: ${{ github.ref_name }}
          releaseName: VocaWin ${{ github.ref_name }} (Windows beta)
          releaseBody: |
            This is a Windows beta for testers. vocawin.com points at GitHub Releases. It is not a store build and not a stable public ship.

            The installers are unsigned. Windows will say the publisher is unknown. That is expected. More info, then Run anyway if you trust the file.
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: false
          releaseCommitish: ${{ github.sha }}
          args: --bundles nsis,msi
