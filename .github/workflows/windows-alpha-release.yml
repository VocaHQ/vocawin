# Windows alpha for testers. Self-signed in CI when secrets exist.
# Not a purchased CA / store build. vocawin.com points at GitHub Releases.
#
# Tag push is the only trigger. windows-ci.yml must never set tagName.
# PRs only cargo test. Main uploads the installer artifact.
# Always prerelease: a GitHub Release here is not a public ship.
# No workflow_dispatch, so a branch click cannot publish.
# includeUpdaterJson is off so we do not upload latest.json.
# Forks without VOCAWIN_SELF_SIGN_* secrets still publish unsigned.

name: Windows alpha release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-alpha-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Windows alpha installers
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write
    env:
      CARGO_TARGET_DIR: C:\t
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # Cache C:\t (CARGO_TARGET_DIR). Later v* tags reuse this job's artifacts.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-targets: false
          cache-directories: C:/t
      - name: Install CMake, LLVM, Ninja, and Vulkan SDK
        shell: pwsh
        run: |
          choco install cmake llvm ninja -y --no-progress
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          echo "C:\Program Files\CMake\bin" >> $env:GITHUB_PATH
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
          $ver = "1.3.290.0"
          $installer = "$env:RUNNER_TEMP\VulkanSDK.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanSDK-$ver-Installer.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait
          echo "VULKAN_SDK=C:\VulkanSDK\$ver" >> $env:GITHUB_ENV
          echo "C:\VulkanSDK\$ver\Bin" >> $env:GITHUB_PATH
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install frontend dependencies
        run: npm ci
      - name: Build NSIS and MSI, attach to the tag Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_TARGET_DIR: C:\t
          CMAKE_GENERATOR: Ninja
        with:
          tagName: ${{ github.ref_name }}
          releaseName: VocaWin ${{ github.ref_name }} (Windows alpha)
          releaseBody: |
            This is a Windows alpha for testers. vocawin.com points at GitHub Releases. It is not a store build and not a stable public ship.

            CI self-signs with CN=VocaWin Alpha (self-signed) when the VocaHQ secrets are present. That puts a publisher name on the file. It is not a purchased CA cert. SmartScreen can still warn on other PCs. A machine that trusts docs/certs/vocawin-alpha.cer can skip the unknown-publisher nag.

            If this build is unsigned (a fork, or the secrets were missing), Windows will say the publisher is unknown. That is expected.
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: false
          releaseCommitish: ${{ github.sha }}
          args: --bundles nsis,msi
      # Same bundle paths as windows-ci.yml (C:\t\release\bundle\...).
      - name: Self-sign alpha installers
        id: sign
        shell: pwsh
        env:
          VOCAWIN_SELF_SIGN_PFX: ${{ secrets.VOCAWIN_SELF_SIGN_PFX }}
          VOCAWIN_SELF_SIGN_PASSWORD: ${{ secrets.VOCAWIN_SELF_SIGN_PASSWORD }}
        run: |
          & "${{ github.workspace }}/.github/scripts/self-sign-alpha.ps1"
      - name: Replace Release assets with signed installers
        if: steps.sign.outputs.signed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @(
            Get-ChildItem -Path "C:\t\release\bundle\nsis\*-setup.exe" -ErrorAction Stop
            Get-ChildItem -Path "C:\t\release\bundle\msi\*.msi" -ErrorAction Stop
          )
          gh release upload "${{ github.ref_name }}" @($files.FullName) --clobber
