# Unsigned Windows alpha for testers. Not a signed store build.
# vocawin.com stays Coming soon; this does not ship a public installer.
#
# Tag push is the only trigger. PR and main stay artifact-only in
# windows-ci.yml (that job must never set tagName).
# Always prerelease: a GitHub Release here is not a public ship.
# No workflow_dispatch, so a branch click cannot publish.
# includeUpdaterJson is off so we do not upload latest.json.

name: Windows alpha release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-alpha-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Unsigned Windows installers
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CARGO_TARGET_DIR: C:\t
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install CMake, LLVM, Ninja, and Vulkan SDK
        shell: pwsh
        run: |
          choco install cmake llvm ninja -y --no-progress
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          echo "C:\Program Files\CMake\bin" >> $env:GITHUB_PATH
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
          $ver = "1.3.290.0"
          $installer = "$env:RUNNER_TEMP\VulkanSDK.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanSDK-$ver-Installer.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait
          echo "VULKAN_SDK=C:\VulkanSDK\$ver" >> $env:GITHUB_ENV
          echo "C:\VulkanSDK\$ver\Bin" >> $env:GITHUB_PATH
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install frontend dependencies
        run: npm ci
      - name: Build unsigned NSIS and MSI, attach to the tag Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_TARGET_DIR: C:\t
          CMAKE_GENERATOR: Ninja
        with:
          tagName: ${{ github.ref_name }}
          releaseName: VocaWin ${{ github.ref_name }} (unsigned Windows alpha)
          releaseBody: |
            This is an unsigned Windows alpha for testers.

            It is not a signed store build, and it is not a public ship. vocawin.com stays Coming soon. There is no public installer.

            Windows may warn that the publisher is unknown. That is expected until we sign.
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: false
          releaseCommitish: ${{ github.sha }}
          args: --bundles nsis,msi
