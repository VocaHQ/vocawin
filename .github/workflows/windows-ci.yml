name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: read

# Do not use on.pull_request.paths. That can skip the whole workflow
# and leave a required check pending. Filter in a cheap ubuntu job
# instead, then skip the Windows VMs when only docs changed.

jobs:
  changes:
    name: Check source changes
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.report.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            source:
              - 'src/**'
              - 'src-tauri/**'
              - 'package.json'
              - 'package-lock.json'
              - 'index.html'
              - 'vite.config.*'
              - 'tsconfig*.json'
              - '.github/workflows/windows-ci.yml'
              - '.github/scripts/**'
      - id: report
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "source=true"
            echo "source=true" >> "$GITHUB_OUTPUT"
          else
            echo "source=${{ steps.filter.outputs.source }}"
            echo "source=${{ steps.filter.outputs.source }}" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}

  test:
    name: Build and test on Windows
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.source == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    env:
      # Short target dir avoids MAX_PATH in whisper.cpp vulkan-shaders-gen nests.
      CARGO_TARGET_DIR: C:\t
      # MSBuild ExternalProject races / FileTracker path limits; Ninja avoids both.
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # rust-cache joins workspaces targets as relative paths, so C:\t has to
      # go in cache-directories. Job-scoped key keeps debug and release apart.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-targets: false
          cache-directories: C:/t
      - name: Install CMake, LLVM, Ninja, and Vulkan SDK
        shell: pwsh
        run: |
          choco install cmake llvm ninja -y --no-progress
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          echo "C:\Program Files\CMake\bin" >> $env:GITHUB_PATH
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
          $ver = "1.3.290.0"
          $installer = "$env:RUNNER_TEMP\VulkanSDK.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanSDK-$ver-Installer.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait
          echo "VULKAN_SDK=C:\VulkanSDK\$ver" >> $env:GITHUB_ENV
          echo "C:\VulkanSDK\$ver\Bin" >> $env:GITHUB_PATH
      # Ninja does not load MSVC INCLUDE/LIB/PATH; vcvars must be exported.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      # Compiles cfg(windows) injection, Vulkan-enabled whisper-rs, and the
      # Tauri command layer. Does not require a physical GPU or microphone.
      - name: Test Rust command layer
        run: cargo test --manifest-path src-tauri/Cargo.toml

  installer:
    name: Windows installer (alpha)
    needs: changes
    # PRs never package. Main packages only when app/workflow source
    # changed. workflow_dispatch still builds test + installer.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.changes.outputs.source == 'true')
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: C:\t
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # Same C:\t cache as the test job. Separate job key (debug vs release).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-targets: false
          cache-directories: C:/t
      - name: Install CMake, LLVM, Ninja, and Vulkan SDK
        shell: pwsh
        run: |
          choco install cmake llvm ninja -y --no-progress
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          echo "C:\Program Files\CMake\bin" >> $env:GITHUB_PATH
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
          $ver = "1.3.290.0"
          $installer = "$env:RUNNER_TEMP\VulkanSDK.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanSDK-$ver-Installer.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait
          echo "VULKAN_SDK=C:\VulkanSDK\$ver" >> $env:GITHUB_ENV
          echo "C:\VulkanSDK\$ver\Bin" >> $env:GITHUB_PATH
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install frontend dependencies
        run: npm ci
      - name: Build NSIS and MSI installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_TARGET_DIR: C:\t
          CMAKE_GENERATOR: Ninja
        with:
          # Build only. Do not set tagName. Tagged alpha Releases live in
          # windows-alpha-release.yml. The moving nightly Release lives in
          # nightly.yml. This job stays artifact-only.
          args: --bundles nsis,msi
          includeUpdaterJson: false
      # tauri-action with CARGO_TARGET_DIR=C:\t writes:
      #   C:\t\release\bundle\nsis\VocaWin_*_x64-setup.exe
      #   C:\t\release\bundle\msi\VocaWin_*_x64_en-US.msi
      # Confirmed on the 2026-08-18 installer job (run 32196306136).
      # Installers stay unsigned. Self-sign hung on Authenticode timestamps.
      - name: Upload Windows alpha installers
        uses: actions/upload-artifact@v4
        with:
          name: VocaWin-windows-alpha
          path: |
            C:/t/release/bundle/nsis/*-setup.exe
            C:/t/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
